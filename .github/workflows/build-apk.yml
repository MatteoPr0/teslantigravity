name: Build Tesla Auto Streamer APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Setup Gradle Cache & Tooling
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.6'
        cache-read-only: false

    - name: Fast Compile APK
      run: |
        gradle assembleDebug --parallel --build-cache --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TeslaAutoStreamer-APK
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Publish Instant Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
      with:
        tag_name: latest
        name: "Tesla Auto Streamer (Ultima Versione)"
        body: "APK nativo puro Android Auto per Tesla Model 3."
        files: app/build/outputs/apk/debug/app-debug.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
